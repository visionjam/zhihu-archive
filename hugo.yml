baseURL: "https://visionjam.github.io/zhihu-archive/"
title: "知乎归档 · VisionJam"
locale: "zh-cn"
defaultContentLanguage: "zh"
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

pagination:
  pagerSize: 20

taxonomies:
  tag: tags

menu:
  main:
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: ranking
      name: 排行
      url: /ranking/
      weight: 25
      params:
        group: more
    - identifier: stats
      name: 统计
      url: /stats/
      weight: 27
      params:
        group: more
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: blog
      name: 博客
      url: "https://visionjam.github.io/"
      weight: 40
      params:
        group: more
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
      params:
        group: more

params:
  env: production
  description: "VisionJam 的知乎回答、想法与文章归档。"
  author: "VisionJam"
  DateFormat: "2006-01-02"
  mainSections:
    - answers
    - articles
    - pins
  homeLimit: 20
  defaultTheme: auto
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  # 填入 GoatCounter 站点代码（如 visionjam）后启用站内浏览量；留空则不加载第三方脚本。
  goatcounter: ""
  # Giscus 站内点赞/评论：主帖 👍 由 CI 构建前写入 data/likes.json。
  comments: true
  giscus:
    repo: "visionjam/zhihu-archive"
    repoId: "R_kgDOVToP6Q"
    category: "Announcements"
    categoryId: "DIC_kwDOVToP6c4DJeNR"
  homeInfoParams:
    Title: "知乎归档"
    Content: "这里保存我在知乎发布的回答、想法与文章。内容按同步时的原样归档，部分条目可能已从知乎删除。"
  footer:
    text: "内容来自知乎，版权归作者所有 · [博客](https://visionjam.github.io/) · [归档站是怎么做的](https://visionjam.github.io/posts/zhihu-archive/)"
  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/visionjam"
    - name: zhihu
      title: 知乎
      url: "https://www.zhihu.com/people/kong-qi-82-94"
    - name: rss
      title: RSS 订阅
      url: "https://visionjam.github.io/zhihu-archive/index.xml"
  assets:
    disableHLJS: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
